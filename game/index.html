<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dragon Ball Polska Online</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #070b12;
}

/* =========================================
   EKRAN LOGOWANIA
========================================= */

#authScreen {
    position: fixed;
    inset: 0;
    z-index: 5000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 50% 35%, #253d79 0%, #10182c 40%, #05070d 100%);
}

.authBox {
    width: min(430px, 92%);
    padding: 35px;

    background: rgba(8, 13, 25, 0.97);

    border: 4px solid #ff9700;
    border-radius: 14px;

    box-shadow:
        0 0 0 5px #050505,
        0 0 45px rgba(255, 145, 0, .3);

    color: white;
    text-align: center;
}

.ball {
    width: 90px;
    height: 90px;

    margin: 0 auto 15px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #c81010;
    font-size: 24px;
    letter-spacing: -4px;

    background:
        radial-gradient(circle at 35% 30%, #ffd86c, #ff9800 55%, #d55200);

    border: 4px solid #c95b00;

    box-shadow:
        inset -10px -10px 18px rgba(0,0,0,.25),
        0 0 25px rgba(255,150,0,.35);
}

.authBox h1 {
    margin: 10px 0 4px;

    color: #ff9d00;

    font-size: 29px;

    text-shadow:
        3px 3px #8e2d00,
        5px 5px #000;
}

.version {
    margin-top: 5px;
    margin-bottom: 25px;

    color: #839dff;

    font-size: 12px;
    font-weight: bold;
}

.tabs {
    display: flex;
    gap: 8px;

    margin-bottom: 18px;
}

.tab {
    width: 50%;
    padding: 12px;

    border: 2px solid #314574;
    border-radius: 5px;

    background: #151f39;
    color: #bbb;

    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: #ff9700;
    border-color: #ff9700;
    color: #111;
}

.authBox input {
    width: 100%;

    margin: 6px 0;
    padding: 14px;

    background: #070b13;

    border: 2px solid #2f4168;
    border-radius: 5px;

    color: white;
    font-size: 15px;

    outline: none;
}

.authBox input:focus {
    border-color: #ff9700;
}

.authButton {
    width: 100%;

    margin-top: 13px;
    padding: 15px;

    border: none;
    border-bottom: 5px solid #a94700;
    border-radius: 5px;

    background: #ff9700;

    color: #111;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.authButton:hover {
    filter: brightness(1.12);
}

#authMessage {
    min-height: 22px;

    margin-top: 13px;
    margin-bottom: 0;

    color: #ffcf63;

    font-size: 13px;
}

.smallInfo {
    color: #65728d;

    font-size: 11px;

    margin-top: 18px;
}


/* =========================================
   GRA
========================================= */

#gameContainer {
    display: none;

    width: 100%;
    height: 100%;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;

    image-rendering: pixelated;
}


/* =========================================
   HUD
========================================= */

#hud {
    position: fixed;

    left: 15px;
    top: 15px;

    z-index: 100;

    min-width: 210px;

    padding: 12px;

    color: white;

    background: rgba(7, 10, 18, .88);

    border: 3px solid #ff9700;
    border-radius: 7px;

    box-shadow: 4px 4px 0 rgba(0,0,0,.6);
}

#playerName {
    color: #ffad21;

    font-size: 16px;
    font-weight: bold;
}

.stats {
    margin-top: 7px;

    font-size: 13px;
    line-height: 1.6;
}

.logout {
    margin-top: 7px;

    padding: 5px 8px;

    background: #202b48;

    border: 1px solid #50628c;

    color: white;

    cursor: pointer;
}


/* =========================================
   DIALOG NPC
========================================= */

#dialog {
    display: none;

    position: fixed;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    z-index: 200;

    width: min(600px, 90%);

    padding: 18px;

    color: white;

    background: #0b101d;

    border: 4px solid white;

    box-shadow: 7px 7px 0 #000;
}

#dialogName {
    color: #ff9d00;

    font-weight: bold;

    margin-bottom: 7px;
}


/* =========================================
   INFO STREFY
========================================= */

#zoneName {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 8px 18px;

    color: white;

    background: rgba(0,0,0,.65);

    border: 2px solid rgba(255,255,255,.4);

    font-weight: bold;

    pointer-events: none;
}


/* =========================================
   MOBILE
========================================= */

#mobileControls {
    display: none;

    position: fixed;

    left: 22px;
    bottom: 22px;

    z-index: 300;
}

.mobileRow {
    display: flex;
    justify-content: center;
}

.move {
    width: 58px;
    height: 58px;

    margin: 2px;

    background: rgba(0,0,0,.7);

    border: 2px solid white;
    border-radius: 9px;

    color: white;

    font-size: 24px;

    touch-action: none;
}

@media(max-width: 800px) {

    #mobileControls {
        display: block;
    }

    #hud {
        font-size: 11px;

        min-width: 170px;
    }

    #zoneName {
        top: auto;
        bottom: 20px;
        right: 15px;
        left: auto;

        transform: none;
    }
}
</style>
</head>

<body>


<!-- ======================================
     LOGOWANIE / REJESTRACJA
======================================= -->

<div id="authScreen">

    <div class="authBox">

        <div class="ball">★★★★</div>

        <h1>
            DRAGON BALL<br>
            POLSKA ONLINE
        </h1>

        <div class="version">
            ALPHA 0.2
        </div>


        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                onclick="setAuthMode('login')"
            >
                LOGOWANIE
            </button>

            <button
                id="registerTab"
                class="tab"
                onclick="setAuthMode('register')"
            >
                REJESTRACJA
            </button>

        </div>


        <input
            id="usernameInput"
            type="text"
            maxlength="16"
            autocomplete="username"
            placeholder="Nazwa wojownika"
        >


        <input
            id="passwordInput"
            type="password"
            maxlength="40"
            autocomplete="current-password"
            placeholder="Hasło"
        >


        <button
            id="authButton"
            class="authButton"
            onclick="submitAuth()"
        >
            ZALOGUJ SIĘ
        </button>


        <p id="authMessage"></p>


        <p class="smallInfo">
            Wersja testowa gry
        </p>

    </div>

</div>



<!-- ======================================
     GRA
======================================= -->

<div id="gameContainer">


    <div id="hud">

        <div id="playerName">
            Wojownik
        </div>

        <div class="stats">

            ❤️ HP:
            <span id="hpText">100/100</span>

            <br>

            ⭐ Poziom:
            <span id="levelText">1</span>

            <br>

            💰 Zeni:
            <span id="zeniText">0</span>

            <br>

            🟠 Smocze Kule:
            <span id="ballsText">0/7</span>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Wyloguj
        </button>

    </div>


    <div id="zoneName">
        🌿 Zielona Dolina
    </div>


    <div id="dialog">

        <div id="dialogName">
            NPC
        </div>

        <div id="dialogText"></div>

    </div>


    <div id="mobileControls">

        <div class="mobileRow">

            <button
                class="move"
                data-key="arrowup"
            >
                ▲
            </button>

        </div>

        <div class="mobileRow">

            <button
                class="move"
                data-key="arrowleft"
            >
                ◀
            </button>

            <button
                class="move"
                data-key="arrowdown"
            >
                ▼
            </button>

            <button
                class="move"
                data-key="arrowright"
            >
                ▶
            </button>

        </div>

    </div>


    <canvas id="game"></canvas>

</div>



<script>

/* =========================================
   KONTA TESTOWE
========================================= */

let authMode = "login";

let currentUser = null;


function setAuthMode(mode) {

    authMode = mode;

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const button =
        document.getElementById("authButton");

    const message =
        document.getElementById("authMessage");


    message.textContent = "";


    if(mode === "login") {

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        button.textContent =
            "ZALOGUJ SIĘ";

    } else {

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        button.textContent =
            "STWÓRZ KONTO";

    }

}


function submitAuth() {

    const username =
        document
        .getElementById("usernameInput")
        .value
        .trim();

    const password =
        document
        .getElementById("passwordInput")
        .value;

    const message =
        document.getElementById("authMessage");


    if(username.length < 3) {

        message.textContent =
            "❌ Nick musi mieć minimum 3 znaki.";

        return;

    }


    if(password.length < 6) {

        message.textContent =
            "❌ Hasło musi mieć minimum 6 znaków.";

        return;

    }


    const accountKey =
        "dbp_account_" +
        username.toLowerCase();


    if(authMode === "register") {

        if(localStorage.getItem(accountKey)) {

            message.textContent =
                "❌ Takie konto już istnieje.";

            return;

        }


        const account = {

            username: username,

            password: password,

            level: 1,

            zeni: 0,

            dragonBalls: 0,

            hp: 100,

            x: 1050,

            y: 800

        };


        localStorage.setItem(
            accountKey,
            JSON.stringify(account)
        );


        message.style.color = "#76e58b";

        message.textContent =
            "✓ Konto utworzone! Możesz się zalogować.";


        setAuthMode("login");

        return;

    }


    const saved =
        localStorage.getItem(accountKey);


    if(!saved) {

        message.style.color = "#ffcf63";

        message.textContent =
            "❌ Nie znaleziono takiego konta.";

        return;

    }


    const account =
        JSON.parse(saved);


    if(account.password !== password) {

        message.textContent =
            "❌ Nieprawidłowe hasło.";

        return;

    }


    currentUser = account;

    startGame();

}



/* =========================================
   START GRY
========================================= */

function startGame() {

    document.getElementById(
        "authScreen"
    ).style.display = "none";


    document.getElementById(
        "gameContainer"
    ).style.display = "block";


    player.name =
        currentUser.username;


    player.x =
        currentUser.x ?? 1050;


    player.y =
        currentUser.y ?? 800;


    document.getElementById(
        "playerName"
    ).textContent =
        player.name;


    updateHUD();


    resize();

}



/* =========================================
   WYLOGOWANIE
========================================= */

function logout() {

    savePlayer();

    currentUser = null;


    document.getElementById(
        "gameContainer"
    ).style.display = "none";


    document.getElementById(
        "authScreen"
    ).style.display = "flex";


    document.getElementById(
        "passwordInput"
    ).value = "";

}



/* =========================================
   ZAPIS
========================================= */

function savePlayer() {

    if(!currentUser) return;


    currentUser.x =
        Math.round(player.x);


    currentUser.y =
        Math.round(player.y);


    const key =
        "dbp_account_" +
        currentUser.username.toLowerCase();


    localStorage.setItem(
        key,
        JSON.stringify(currentUser)
    );

}



/* =========================================
   HUD
========================================= */

function updateHUD() {

    if(!currentUser) return;


    document.getElementById(
        "hpText"
    ).textContent =
        currentUser.hp + "/100";


    document.getElementById(
        "levelText"
    ).textContent =
        currentUser.level;


    document.getElementById(
        "zeniText"
    ).textContent =
        currentUser.zeni;


    document.getElementById(
        "ballsText"
    ).textContent =
        currentUser.dragonBalls + "/7";

}



/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("game");


const ctx =
    canvas.getContext("2d");


ctx.imageSmoothingEnabled = false;


function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resize
);


resize();



/* =========================================
   ŚWIAT
========================================= */

const WORLD_WIDTH = 2400;

const WORLD_HEIGHT = 1700;

const TILE = 32;



/* =========================================
   GRACZ
========================================= */

const player = {

    x: 1050,

    y: 800,

    width: 28,

    height: 38,

    speed: 220,

    name: "Wojownik"

};



/* =========================================
   STEROWANIE
========================================= */

const keys = {};


window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;

    }
);



document
.querySelectorAll(".move")
.forEach(button => {

    const key =
        button.dataset.key;


    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

});



/* =========================================
   OBIEKTY
========================================= */

const obstacles = [

    {
        x: 250,
        y: 250,
        w: 260,
        h: 180,
        type: "house"
    },

    {
        x: 1720,
        y: 330,
        w: 260,
        h: 180,
        type: "house"
    },

    {
        x: 650,
        y: 1130,
        w: 470,
        h: 270,
        type: "water"
    },

    {
        x: 1300,
        y: 260,
        w: 110,
        h: 90,
        type: "rock"
    },

    {
        x: 1450,
        y: 310,
        w: 90,
        h: 75,
        type: "rock"
    }

];



/* =========================================
   DRZEWA
========================================= */

const trees = [];


for(let i = 0; i < 55; i++) {

    const x =
        70 +
        Math.random() *
        (WORLD_WIDTH - 140);


    const y =
        70 +
        Math.random() *
        (WORLD_HEIGHT - 140);


    if(
        Math.abs(x - 1050) < 240 &&
        Math.abs(y - 800) < 240
    ) {

        continue;

    }


    trees.push({

        x: x,

        y: y,

        w: 46,

        h: 58

    });

}



/* =========================================
   NPC
========================================= */

const npcs = [

    {

        x: 900,

        y: 650,

        name: "Mistrz",

        text:
        "Witaj! Rozwijaj swoją postać, zdobywaj Zeni i szukaj siedmiu Smoczych Kul."

    },


    {

        x: 480,

        y: 680,

        name: "Handlarz",

        text:
        "Niedługo będziesz mógł kupować tutaj przedmioty za Zeni."

    },


    {

        x: 1600,

        y: 760,

        name: "Wróżka",

        text:
        "Czuję niezwykłą energię... Smocze Kule są gdzieś w tym świecie."

    }

];



/* =========================================
   KOLIZJA
========================================= */

function collision(
    x,
    y,
    w,
    h,
    obj
) {

    return (

        x < obj.x + obj.w &&

        x + w > obj.x &&

        y < obj.y + obj.h &&

        y + h > obj.y

    );

}



function blocked(x, y) {

    if(
        x < 0 ||
        y < 0 ||
        x + player.width > WORLD_WIDTH ||
        y + player.height > WORLD_HEIGHT
    ) {

        return true;

    }


    for(const obj of obstacles) {

        if(
            collision(
                x,
                y,
                player.width,
                player.height,
                obj
            )
        ) {

            return true;

        }

    }


    for(const tree of trees) {

        const trunk = {

            x: tree.x + 13,

            y: tree.y + 34,

            w: 20,

            h: 24

        };


        if(
            collision(
                x,
                y,
                player.width,
                player.height,
                trunk
            )
        ) {

            return true;

        }

    }


    return false;

}



/* =========================================
   NPC DIALOG
========================================= */

const dialog =
    document.getElementById("dialog");


function checkNPC() {

    let found = null;


    for(const npc of npcs) {

        const distance =
            Math.hypot(
                player.x - npc.x,
                player.y - npc.y
            );


        if(distance < 90) {

            found = npc;

            break;

        }

    }


    if(found) {

        dialog.style.display =
            "block";


        document.getElementById(
            "dialogName"
        ).textContent =
            found.name;


        document.getElementById(
            "dialogText"
        ).textContent =
            found.text;

    } else {

        dialog.style.display =
            "none";

    }

}



/* =========================================
   UPDATE
========================================= */

let lastTime =
    performance.now();


let saveTimer = 0;


function update(time) {

    const dt =
        Math.min(
            (time - lastTime) / 1000,
            0.05
        );


    lastTime = time;


    if(currentUser) {

        let dx = 0;

        let dy = 0;


        if(
            keys["w"] ||
            keys["arrowup"]
        ) {

            dy--;

        }


        if(
            keys["s"] ||
            keys["arrowdown"]
        ) {

            dy++;

        }


        if(
            keys["a"] ||
            keys["arrowleft"]
        ) {

            dx--;

        }


        if(
            keys["d"] ||
            keys["arrowright"]
        ) {

            dx++;

        }


        if(dx || dy) {

            const length =
                Math.hypot(dx, dy);


            dx /= length;

            dy /= length;

        }


        const newX =
            player.x +
            dx *
            player.speed *
            dt;


        const newY =
            player.y +
            dy *
            player.speed *
            dt;


        if(
            !blocked(
                newX,
                player.y
            )
        ) {

            player.x =
                newX;

        }


        if(
            !blocked(
                player.x,
                newY
            )
        ) {

            player.y =
                newY;

        }


        checkNPC();


        saveTimer += dt;


        if(saveTimer >= 3) {

            savePlayer();

            saveTimer = 0;

        }


        draw();

    }


    requestAnimationFrame(update);

}



/* =========================================
   TŁO
========================================= */

function drawGround(
    cameraX,
    cameraY
) {

    ctx.fillStyle =
        "#55a94f";


    ctx.fillRect(
        -cameraX,
        -cameraY,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    for(
        let x = 0;
        x < WORLD_WIDTH;
        x += TILE
    ) {

        for(
            let y = 0;
            y < WORLD_HEIGHT;
            y += TILE
        ) {

            if(
                (
                    x / TILE +
                    y / TILE
                ) % 2 === 0
            ) {

                ctx.fillStyle =
                    "rgba(0,0,0,.035)";


                ctx.fillRect(
                    x - cameraX,
                    y - cameraY,
                    TILE,
                    TILE
                );

            }

        }

    }

}



/* =========================================
   DROGI
========================================= */

function drawRoads(
    cameraX,
    cameraY
) {

    ctx.fillStyle =
        "#d9ba73";


    ctx.fillRect(
        -cameraX,
        760 - cameraY,
        WORLD_WIDTH,
        125
    );


    ctx.fillRect(
        1000 - cameraX,
        -cameraY,
        135,
        WORLD_HEIGHT
    );

}



/* =========================================
   DOM
========================================= */

function drawHouse(
    obj,
    cameraX,
    cameraY
) {

    const x =
        obj.x - cameraX;


    const y =
        obj.y - cameraY;


    ctx.fillStyle =
        "#ead4a5";


    ctx.fillRect(
        x,
        y + 55,
        obj.w,
        obj.h - 55
    );


    ctx.fillStyle =
        "#e6593e";


    ctx.beginPath();

    ctx.moveTo(
        x - 20,
        y + 65
    );

    ctx.lineTo(
        x + obj.w / 2,
        y
    );

    ctx.lineTo(
        x + obj.w + 20,
        y + 65
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#6d4027";


    ctx.fillRect(
        x + obj.w / 2 - 24,
        y + obj.h - 70,
        48,
        70
    );


    ctx.fillStyle =
        "#75c8e8";


    ctx.fillRect(
        x + 35,
        y + 90,
        45,
        40
    );

}



/* =========================================
   WODA
========================================= */

function drawWater(
    obj,
    cameraX,
    cameraY
) {

    ctx.fillStyle =
        "#3198d3";


    ctx.fillRect(
        obj.x - cameraX,
        obj.y - cameraY,
        obj.w,
        obj.h
    );


    ctx.fillStyle =
        "#65c8ed";


    for(
        let y = 25;
        y < obj.h;
        y += 45
    ) {

        ctx.fillRect(
            obj.x - cameraX + 20,
            obj.y - cameraY + y,
            obj.w - 40,
            5
        );

    }

}



/* =========================================
   SKAŁY
========================================= */

function drawRock(
    obj,
    cameraX,
    cameraY
) {

    ctx.fillStyle =
        "#73797e";


    ctx.fillRect(
        obj.x - cameraX,
        obj.y - cameraY + 20,
        obj.w,
        obj.h - 20
    );


    ctx.fillStyle =
        "#a5aaae";


    ctx.fillRect(
        obj.x - cameraX + 15,
        obj.y - cameraY,
        obj.w - 30,
        30
    );

}



/* =========================================
   DRZEWO
========================================= */

function drawTree(
    tree,
    cameraX,
    cameraY
) {

    const x =

        "#176b38";


    ctx.fillRect(

    );

    );

/* =========================================
   RYSOWANIE
========================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let cameraX =
        player.x -
        canvas.width / 2 +
        player.width / 2;


    let cameraY =
        player.y -
        canvas.height / 2 +
        player.height / 2;


    cameraX =
        Math.max(
            0,
            Math.min(
                cameraX,
                Math.max(
                    0,
                    WORLD_WIDTH -
                    canvas.width
                )
            )
        );


    cameraY =
        Math.max(
            0,
            Math.min(
                cameraY,
                Math.max(
                    0,
                    WORLD_HEIGHT -
                    canvas.height
                )
            )
        );


    drawGround(
        cameraX,
        cameraY
    );


    drawRoads(
        cameraX,
        cameraY
    );


    for(const obj of obstacles) {

        if(obj.type === "house") {

            drawHouse(
                obj,
                cameraX,
                cameraY
            );

        }


        if(obj.type === "water") {

            drawWater(
                obj,
                cameraX,
                cameraY
            );

        }


        if(obj.type === "rock") {

            drawRock(
                obj,
                cameraX,
                cameraY
            );

        }

    }


    for(const tree of trees) {

        drawTree(
            tree,
            cameraX,
            cameraY
        );

    }


    for(const npc of npcs) {

        drawNPC(
            npc,
            cameraX,
            cameraY
        );

    }


    drawPlayer(
        cameraX,
        cameraY
    );

}
